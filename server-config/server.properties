# Copiado para server/ a cada start: edite aqui, nao em server/server.properties.
motd=\u00A76\u00A7lMinezada
max-players=10
difficulty=normal
# Distancias moderadas: geracao de terreno com Terralith/estruturas pesa; cada um ve mais longe pelo proprio jogo se quiser.
view-distance=8
simulation-distance=6
# Grava chunks sem esperar o disco a cada escrita: bem mais leve; o risco e so perder segundos se a maquina desligar na tomada.
sync-chunk-writes=false
spawn-protection=0
online-mode=false
white-list=true
enforce-whitelist=true
server-port=25565
level-name=world
