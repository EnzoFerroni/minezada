# conferir: monta o pack de novo a partir do mods.txt e falha se modpack/pack mudar (mods.txt editado sem
# montar, ou dependencia quebrada dentro de um jar). atualizacoes: toda segunda procura versoes novas dos mods
# e abre (ou atualiza) uma issue com a lista, sem commit: versao nova de mod e codigo novo no PC de todos.
name: Pack

on:
  push:
    paths: ['modpack/**', 'scripts/montar-pack.ps1', 'scripts/missoes.ps1', 'docs/missoes.md', 'server-config/config/ftbquests/**', '.github/workflows/pack.yml']
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conferir:
    # So no main: o environment producao nega os segredos em outra branch (la o job falharia).
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: producao # segredos so no main
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Jars (~600 MB) guardados entre execucoes: menos download do Modrinth e do CurseForge, menos erro de rede (522, 429).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/jars
          key: jars-${{ hashFiles('modpack/pack/index.toml') }}
          restore-keys: jars-
      - name: Montar de novo e comparar
        shell: pwsh
        env:
          CURSEFORGE_KEY: ${{ secrets.CURSEFORGE_KEY }}
        run: |
          $v = [regex]::Match((Get-Content modpack/pack/pack.toml -Raw), 'version = "(.+?)"').Groups[1].Value
          ./scripts/montar-pack.ps1 -Versao $v
          git diff --stat -- modpack/pack docs/missoes.md server-config/config/ftbquests
          git diff --quiet -- modpack/pack docs/missoes.md server-config/config/ftbquests
          if ($LASTEXITCODE) { Write-Host '::error::modpack/pack, livro ou docs/missoes.md nao batem: rode scripts/montar-pack.ps1 e faca commit'; exit 1 }

  atualizacoes:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    environment: producao # segredos so no main
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # packwiz (release.yml) e packwiz-installer (montar-pack.ps1) sao fixos: so avisa, nao troca sozinho.
      - name: Procurar versao nova do packwiz e abrir issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          corpo=""
          fixo=$(grep -oE 'packwiz/packwiz@[0-9a-f]{40}' .github/workflows/release.yml | cut -d@ -f2)
          ult=$(gh api repos/packwiz/packwiz/commits/main -q .sha)
          [ "$fixo" = "$ult" ] || corpo="$corpo- packwiz: fixo $fixo em release.yml, ultimo commit $ult"$'\n'
          for r in packwiz-installer-bootstrap packwiz-installer; do
            fixo=$(grep -oE "packwiz/$r/releases/download/[^/]+" scripts/montar-pack.ps1 | cut -d/ -f5)
            ult=$(gh api "repos/packwiz/$r/releases/latest" -q .tag_name)
            [ "$fixo" = "$ult" ] || corpo="$corpo- $r: fixo $fixo em scripts/montar-pack.ps1, ultimo release $ult"$'\n'
          done
          [ -n "$corpo" ] || { echo 'packwiz em dia.'; exit 0; }
          corpo="Versao nova em $(date +%F):"$'\n\n'"$corpo"$'\n'"Para aplicar: ler o changelog, trocar o commit/versao e o SHA-256, e seguir o checklist do CONTRIBUTING."
          titulo='Packwiz com versao nova'
          n=$(gh issue list --state open --search "in:title \"$titulo\"" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue edit "$n" --body "$corpo"; else gh issue create --title "$titulo" --body "$corpo"; fi
      - name: Procurar versoes novas e abrir issue
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CURSEFORGE_KEY: ${{ secrets.CURSEFORGE_KEY }}
        run: |
          $log = try { ./scripts/montar-pack.ps1 -Atualizar *>&1 | Out-String } catch { "ERRO: $_" }
          $linhas = $log -split "`n"
          $mudou = @($linhas | Where-Object { $_ -match '^  [-+] ' } | ForEach-Object { $_.Trim() })
          if (-not $mudou) { Write-Host 'Nenhuma versao nova.'; exit 0 }
          $deps = @($linhas | Where-Object { $_ -match '^\s+\[(jogo|servidor)\]|problema\(s\)|^ERRO' })
          $conf = if ($deps) { "Conferencia dos jars com as versoes novas:`n``````n$($deps -join "`n")`n``````" } else { 'Conferencia dos jars com as versoes novas: ok.' }
          $corpo = "Versoes novas no Modrinth em $(Get-Date -Format 'yyyy-MM-dd') (montar-pack -Atualizar, sem commit).`n`n``````diff`n$($mudou -join "`n")`n```````n`n$conf`n`nPara aplicar: ler o changelog dos mods, rodar ``scripts/montar-pack.ps1 -Atualizar`` e seguir o checklist do CONTRIBUTING."
          $titulo = 'Mods com versao nova'
          $n = gh issue list --state open --search "in:title `"$titulo`"" --json number --jq '.[0].number'
          if ($n) { gh issue edit $n --body $corpo } else { gh issue create --title $titulo --body $corpo }
