# Testa os scripts de hospedar a cada push que mexe neles, sem Minecraft de verdade:
# - Mac (bash 3.2 do macOS) e Linux: stop, Ctrl+C e janela fechada salvam, enviam o mundo e liberam a trava (issue #7)
# - whitelist (scripts/Whitelist.java, a mesma no Mac, no Linux e no Windows)
# - envio do mundo ao GitHub (scripts/MundoGithub.java) e aviso do selo (scripts/Selo.java), contra um GitHub falso
# - Mac e Linux: minezada.sh (teclas, pacotes, avisos dos mods, perfis, shader) em uma .minecraft falsa
# - Linux: jogar.sh cria a instancia e o atalho do menu com um launcher falso
# - Windows: sintaxe dos .ps1 no PowerShell 5.1 e BOM em .ps1 com acento; shellcheck nos .sh
# - Windows: desinstalar.ps1 em uma arvore falsa (issue #25)
name: Testes dos scripts

on:
  push:
    paths: ['scripts/**', '*.sh', '*.ps1', '*.command', '*.bat', 'modpack/arquivos/minezada.*', '.github/workflows/scripts.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # Actions fixadas por commit: um release adulterado delas nao roda aqui.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -S warning scripts/*.sh scripts/testes/*.sh ./*.sh iniciar.command modpack/arquivos/minezada.sh
      - name: desinstalar.sh
        run: /bin/bash scripts/testes/desinstalar.sh
      - name: minezada.sh (antes de abrir o jogo, .minecraft falsa)
        run: /bin/bash scripts/testes/minezada.sh
      - name: resetar.sh (repo, servidor e Drive falsos)
        run: /bin/bash scripts/testes/resetar.sh
      - name: jogar.sh no Linux (HOME falso, launcher falso)
        if: runner.os == 'Linux'
        run: bash scripts/testes/jogar.sh
      - name: jogar.sh no Linux baixa e roda os AppImages de verdade
        if: runner.os == 'Linux'
        run: bash scripts/testes/jogar-appimage.sh
      # /bin/bash: no macOS e o 3.2, o mesmo que roda o iniciar.command (o do Homebrew pode vir antes no PATH).
      - name: Desligar o servidor (stop, Ctrl+C, janela fechada)
        run: /bin/bash scripts/testes/desligar.sh
      - name: Whitelist
        run: java scripts/testes/WhitelistTeste.java
      - name: Mundo no GitHub (GitHub falso, local)
        run: java scripts/testes/MundoGithubTeste.java
      - name: Selo avisado pelo iniciar (GitHub falso, local)
        run: java scripts/testes/SeloTeste.java

  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sintaxe dos .ps1 (PowerShell 5.1) e BOM em quem tem acento
        shell: powershell
        run: |
          $erros = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            foreach ($x in $e) { Write-Host "::error file=$($_.FullName),line=$($x.Extent.StartLineNumber)::$($x.Message)"; $erros++ }
            # Sem BOM, o PS 5.1 le o arquivo como ANSI e estraga o acento (licao do CONTRIBUTING).
            $b = [IO.File]::ReadAllBytes($_.FullName)
            if (($b | Where-Object { $_ -gt 127 }) -and -not ($b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)) {
              Write-Host "::error file=$($_.FullName)::.ps1 com acento precisa de BOM (salve como UTF-8 com BOM)"; $erros++
            }
          }
          if ($erros) { exit 1 }
          Write-Host 'ok    sintaxe e BOM'
      - name: Versoes (dependencias dos jars no montar-pack)
        shell: powershell
        run: scripts/testes/versoes.ps1
      - name: Desinstalar (arvore falsa)
        shell: powershell
        run: scripts/testes/desinstalar.ps1
      - name: Antes de abrir o jogo (minezada.ps1 em pasta falsa)
        shell: powershell
        run: scripts/testes/minezada.ps1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Resetar (repo, servidor e Drive falsos)
        shell: powershell
        run: scripts/testes/resetar.ps1
      - name: Whitelist
        run: java scripts/testes/WhitelistTeste.java
      - name: Mundo no GitHub (GitHub falso, local)
        run: java scripts/testes/MundoGithubTeste.java
      - name: Selo avisado pelo iniciar (GitHub falso, local)
        run: java scripts/testes/SeloTeste.java
