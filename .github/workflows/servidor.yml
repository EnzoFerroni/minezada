# Sobe o servidor com o pack do repo e espera o "Done": pega mod faltando ou incompativel no servidor
# antes de chegar em quem hospeda. O job "jogo" abre o cliente e entra em um mundo (mods so de cliente).
name: Servidor de teste

on:
  push:
    paths: ['modpack/**', 'server-config/**', '.github/workflows/servidor.yml']
  workflow_dispatch:
  # Toda semana, para pegar quebra de fora (Prism novo, link morto, Modrinth).
  schedule:
    - cron: '0 6 * * 0'

permissions:
  contents: read

jobs:
  servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions fixadas por commit: um release adulterado delas nao roda aqui.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar NeoForge e mods (mesmo caminho do iniciar.sh)
        run: |
          neo="$(sed -n 's/^neoforge = "\(.*\)"/\1/p' modpack/pack/pack.toml)"
          mkdir -p server && cd server
          curl -fsSL --retry 5 --retry-all-errors "https://maven.neoforged.net/releases/net/neoforged/neoforge/$neo/neoforge-$neo-installer.jar" -o installer.jar
          java -jar installer.jar --installServer . > /dev/null
          unzip -o -q -j ../modpack/minezada-prism.zip .minecraft/packwiz-installer-bootstrap.jar .minecraft/packwiz-installer.jar -d .
          # Ate 3 tentativas: o Modrinth e o CurseForge as vezes demoram (522, 429); o packwiz continua de onde parou.
          for i in 1 2 3; do
            java -jar packwiz-installer-bootstrap.jar --bootstrap-no-update --bootstrap-main-jar packwiz-installer.jar \
              -g -s server "file://$GITHUB_WORKSPACE/modpack/pack/pack.toml" && break
            [ "$i" = 3 ] && exit 1; sleep 30
          done
          echo eula=true > eula.txt
          cp -R ../server-config/. .
          echo "NEO=$neo" >> "$GITHUB_ENV"

      - name: Subir ate o Done e desligar com stop
        working-directory: server
        run: |
          mkfifo console
          timeout 900 java -Xmx4G "@libraries/net/neoforged/neoforge/$NEO/unix_args.txt" nogui < console > saida.log 2>&1 &
          pid=$!
          exec 3> console
          until grep -q 'Done (' logs/latest.log 2> /dev/null || ! kill -0 $pid 2> /dev/null; do sleep 2; done
          echo stop >&3
          wait $pid || true
          if ! grep -q 'Done (' logs/latest.log 2> /dev/null; then
            echo "::error::O servidor nao chegou no Done"
            tail -n 150 saida.log
            exit 1
          fi
          grep -E 'Done \(|Stopping the server' logs/latest.log
          # Livro de missoes (server-config/config/ftbquests): carregou e sem erro do FTB Quests.
          if ! grep -qE 'FTB Quests/\]: Loaded .* [1-9][0-9]* quests' logs/latest.log || grep -E '/(ERROR|WARN)\] \[FTB Quests' logs/latest.log; then
            echo "::error::Livro de missoes nao carregou (ou deu erro); veja scripts/missoes.ps1"
            exit 1
          fi
          # Item do livro que nao existe no jogo (desligado no mod ou so variante): o servidor avisa ao carregar.
          ausentes=$(grep -oE "Tried to load invalid item: .*minecraft:item\]: [a-z0-9_.-]+:[a-z0-9_/.-]+" logs/latest.log | sed 's/.*: //' | sort -u | while read -r id; do grep -rqF "\"$id\"" config/ftbquests/quests && echo "$id"; done || true)
          if [ -n "$ausentes" ]; then
            echo "::error::Itens do livro que nao existem no jogo: $ausentes (troque em scripts/missoes.ps1)"
            exit 1
          fi

      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-do-servidor
          path: |
            server/logs/
            server/crash-reports/
            server/saida.log
          if-no-files-found: ignore

  # Abre o jogo com os mods de cliente (HeadlessMC em tela virtual), entra em um mundo novo e fecha: pega mod so de
  # cliente com dependencia errada, que o servidor nao carrega. Sem o Distant Horizons (ver o passo abaixo).
  jogo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Baixar os mods do jogo (packwiz, lado cliente)
        run: |
          mkdir -p run && cd run
          unzip -o -q -j ../modpack/minezada-prism.zip .minecraft/packwiz-installer-bootstrap.jar .minecraft/packwiz-installer.jar -d .
          for i in 1 2 3; do
            java -jar packwiz-installer-bootstrap.jar --bootstrap-no-update --bootstrap-main-jar packwiz-installer.jar \
              -g -s client "file://$GITHUB_WORKSPACE/modpack/pack/pack.toml" && break
            [ "$i" = 3 ] && exit 1; sleep 30
          done
          # Distant Horizons (opcional, desligado por padrao) as vezes trava no GLProxy da tela virtual (#31).
          rm -f mods/DistantHorizons*
          ls mods | wc -l

      # Sem os GameTests dos mods (/test runall): um teste do Sable falha no CI, o jogo fecha e a action fica presa.
      # So carregar e entrar no mundo (~3 min); o limite pega travamento.
      - name: Abrir o jogo e entrar em um mundo
        timeout-minutes: 15
        uses: headlesshq/mc-runtime-test@dfc8a2a0145f723b01abda5e1cf59eaba516d128 # 5.0.0
        with:
          mc: 1.21.1
          modloader: neoforge
          java: 21
          mc-runtime-test: neoforge
          headlessmc-command: --jvm "-DMcRuntimeGameTest=false -Djava.awt.headless=true"

      - name: Guardar logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-do-jogo
          path: |
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore
