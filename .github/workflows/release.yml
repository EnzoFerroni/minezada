# A cada Release publicada: anexa o .mrpack (abre no Prism, Modrinth App, ATLauncher) e o zip do Prism.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de uma Release que ja existe'
        required: true

permissions:
  contents: read

jobs:
  anexar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tag igual a versao do pack
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' modpack/pack/pack.toml)
          [ "$TAG" = "v$v" ] || { echo "::error::tag $TAG, mas o pack.toml diz $v"; exit 1; }
      # Acrescenta nas notas os mods que entraram, sairam e mudaram de versao desde a Release anterior.
      - name: Mods nas notas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export LC_ALL=C
          ant=$(git tag -l 'v*' --sort=-creatordate | grep -vx "$TAG" | head -1)
          [ -n "$ant" ] || exit 0
          nomes() { git ls-tree --name-only "$1" modpack/pack/mods/ | while read -r f; do
            printf '%s\t%s\n' "$(git show "$1:$f" | sed -n 's/^name = "\(.*\)"/\1/p')" "$(git show "$1:$f" | sed -n 's/^filename = "\(.*\)"/\1/p')"; done | sort; }
          nomes "$ant" > a.tsv; nomes "$TAG" > b.tsv
          lista() { if [ -s "$1" ]; then sed 's/^/- /' "$1"; else echo "- nenhum"; fi; }
          cut -f1 a.tsv | sort -u > an; cut -f1 b.tsv | sort -u > bn
          comm -13 an bn > entraram; comm -23 an bn > sairam
          join -t$'\t' a.tsv b.tsv | awk -F'\t' '$2!=$3{print $1}' > mudaram
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > notas.md
          grep -q '^## Mods desde' notas.md && exit 0
          { echo; echo "## Mods desde $ant"; echo; echo "Entraram:"; lista entraram; echo; echo "Sairam:"; lista sairam
            echo; echo "Versao nova:"; lista mudaram; } >> notas.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notas.md
      - name: Titulo padrao
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Pack ${TAG#v}"
      # packwiz fixo por commit. O export baixa cada mod para calcular o sha512 que o .mrpack exige.
      - name: Gerar o .mrpack
        run: |
          go install github.com/packwiz/packwiz@170b22d785959dda5876b54b7f16e1b807a57fb6
          cd modpack/pack
          "$(go env GOPATH)/bin/packwiz" -y modrinth export -o "$GITHUB_WORKSPACE/minezada-$TAG.mrpack"
      # Prova de origem: gh attestation verify <arquivo> --repo EnzoFerroni/minezada
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            minezada-${{ env.TAG }}.mrpack
            modpack/minezada-prism.zip
      - name: Anexar na Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "minezada-$TAG.mrpack" modpack/minezada-prism.zip --clobber --repo "$GITHUB_REPOSITORY"
