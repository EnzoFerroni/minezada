# Confere os workflows com o zizmor (permissoes demais, Action sem pin, texto de fora dentro de run:).
name: Seguranca dos workflows

on:
  push:
    paths: ['.github/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        run: pipx run zizmor==1.20.0 --offline .github/workflows
